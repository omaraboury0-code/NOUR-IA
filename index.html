<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Beauté &amp; Skincare — Boutique</title>
  <style>
    :root {
      --bg: #faf8f6;
      --surface: #ffffff;
      --text: #1c1917;
      --muted: #6b6560;
      --accent: #b45309;
      --border: #e7e2dc;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }

    header {
      position: sticky;
      top: 0;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 1rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 10;
    }

    .brand {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    .cart-btn {
      background: var(--text);
      color: #fff;
      border: none;
      padding: 0.55rem 1rem;
      border-radius: 999px;
      cursor: pointer;
      font-size: 0.9rem;
    }

    .hero {
      padding: 3rem 1.5rem;
      text-align: center;
      background: #f3ede6;
      border-bottom: 1px solid var(--border);
    }

    .hero h1 {
      font-size: 2rem;
      margin-bottom: 0.5rem;
    }

    .hero p {
      color: var(--muted);
      max-width: 540px;
      margin: 0 auto;
    }

    .container {
      max-width: 1100px;
      margin: 2rem auto;
      padding: 0 1.5rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 1.25rem;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 0.75rem;
    }

    .badge {
      display: inline-block;
      font-size: 0.75rem;
      background: #fef3c7;
      color: var(--accent);
      padding: 0.2rem 0.5rem;
      border-radius: 6px;
      font-weight: 600;
      width: fit-content;
    }

    .card h2 {
      font-size: 1.05rem;
    }

    .card p {
      font-size: 0.88rem;
      color: var(--muted);
    }

    .price-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 0.5rem;
    }

    .price {
      font-weight: 700;
      font-size: 1rem;
    }

    .add-btn {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 0.45rem 0.85rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
    }

    .add-btn:hover {
      opacity: 0.92;
    }

    footer {
      text-align: center;
      padding: 2rem 1rem;
      color: var(--muted);
      font-size: 0.85rem;
      border-top: 1px solid var(--border);
      margin-top: 3rem;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">MAISON BEAUTÉ</div>
    <button class="cart-btn" id="cartBtn" type="button">Panier (0)</button>
  </header>

  <section class="hero">
    <h1>Skincare &amp; Essentiels Beauté</h1>
    <p>Sélection de soins visage, lèvres et cheveux avec livraison rapide.</p>
  </section>

  <main class="container">
    <div class="grid" id="productGrid"></div>
  </main>

  <footer>
    Exemple de page vitrine HTML/CSS/JS — personnalisez vos produits et prix.
  </footer>

  <script>
    const products = [
      {
        id: 1,
        tag: "Best-seller",
        name: "Lotion Tonique Hydratante",
        desc: "Apaise et repulpe la peau au quotidien.",
        price: 240
      },
      {
        id: 2,
        tag: "Nouveau",
        name: "Sérum Éclat Niacinamide",
        desc: "Unifie le grain de peau et apporte de l'éclat.",
        price: 245
      },
      {
        id: 3,
        tag: "Promo",
        name: "Baume Lèvres Nourrissant",
        desc: "Texture fondante pour des lèvres douces.",
        price: 190
      },
      {
        id: 4,
        tag: "Soin",
        name: "Masque Capillaire Réparateur",
        desc: "Nourrit intensément les longueurs sèches.",
        price: 270
      }
    ];

    let cartCount = 0;
    const grid = document.getElementById("productGrid");
    const cartBtn = document.getElementById("cartBtn");

    products.forEach((item) => {
      const card = document.createElement("article");
      card.className = "card";
      card.innerHTML = `
        <div>
          <span class="badge">${item.tag}</span>
          <h2>${item.name}</h2>
          <p>${item.desc}</p>
        </div>
        <div class="price-row">
          <span class="price">${item.price} DH</span>
          <button class="add-btn" type="button" data-id="${item.id}">Ajouter</button>
        </div>
      `;
      grid.appendChild(card);
    });

    grid.addEventListener("click", (e) => {
      if (e.target.classList.contains("add-btn")) {
        cartCount += 1;
        cartBtn.textContent = `Panier (${cartCount})`;
      }
    });
  </script>
</body>
</html>
