body{margin:0;color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif}
h1,h2,.brand{font-family:Georgia,"Times New Roman",serif}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);background:var(--hb);backdrop-filter:blur(8px);z-index:5}
.brand{font-size:20px;font-weight:700;color:var(--rose)}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.lang{border:1px solid var(--rose);background:transparent;color:var(--rose);border-radius:999px;padding:6px 14px}
.hero{display:grid;grid-template-columns:1fr auto;align-items:center;gap:20px;padding:40px 20px 28px;max-width:1000px;margin:auto}
.hero>div{background:var(--pn);backdrop-filter:blur(6px);padding:22px;border-radius:16px}
.hero h1{font-size:clamp(34px,8vw,64px);line-height:1.05;margin:0 0 12px;color:var(--rose)}
.hero p{margin:0;max-width:46ch;color:var(--muted)}
.hero svg{width:clamp(90px,22vw,200px);height:auto}
.tools{max-width:1000px;margin:auto;padding:0 20px}
input[type=search]{width:100%;padding:12px 16px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);font:inherit}
.chips{display:flex;gap:8px;overflow-x:auto;padding:14px 0}
.chip{white-space:nowrap;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 14px}
.chip[aria-pressed=true]{background:var(--rose);color:var(--on-rose);border-color:var(--rose)}
.grid{max-width:1000px;margin:auto;padding:6px 20px 40px;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.tile{aspect-ratio:4/5;background:var(--rose2)}
.tile img{width:100%;height:100%;object-fit:cover;display:block}
.body{padding:14px;display:flex;flex-direction:column;gap:4px;flex:1}
.body h2{font-size:17px;margin:0;line-height:1.25}
.ar{color:var(--muted);font-size:15px}
.size{color:var(--gold);font-size:14px;font-weight:600}
.order{margin-top:auto;padding-top:10px}
.order a{display:block;text-align:center;text-decoration:none;background:var(--rose);color:var(--on-rose);border-radius:10px;padding:9px}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:40px 0}
.wa{position:fixed;inset-inline-end:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:9;display:flex;align-items:center;gap:8px;background:#25d366;color:#fff;text-decoration:none;border-radius:999px;padding:12px 18px;font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.wa svg{width:24px;height:24px;fill:#fff}
.card{cursor:pointer}
.ov{position:fixed;inset:0;background:rgba(20,5,12,.6);display:none;align-items:flex-end;justify-content:center;z-index:30}
.ov.on{display:flex}
.sheet{background:var(--surface);color:var(--ink);width:min(520px,100%);max-height:90%;overflow:auto;border-radius:18px 18px 0 0;padding-bottom:env(safe-area-inset-bottom,0px);position:relative}
.sheet img{width:100%;max-height:300px;object-fit:cover;display:block}
.sheet .in{padding:18px;display:flex;flex-direction:column;gap:8px}
.sheet h2{font-size:22px;margin:0}
.sheet .ben{align-self:flex-start;background:var(--rose2);color:var(--rose);border-radius:999px;padding:4px 12px;font-size:14px;font-weight:600}
.sheet p{margin:0;line-height:1.7}

$("lang").onclick=function(){lang=lang==="fr"?"ar":"fr";render()};
$("q").oninput=render;
$("chips").onclick=function(e){var k=e.target.getAttribute("data-k");if(k){cat=k;render()}};
function openP(p){
  var t=T[lang],ar=lang==="ar";
  $("m-img").src=p.img;$("m-img").alt=p.fr;
  $("m-t").textContent=ar?p.ar:p.fr;$("m-s").textContent=ar?p.fr:p.ar;
  $("m-z").textContent=p.s||"";
  $("m-b").textContent=ar?p.ba:"";$("m-b").style.display=(ar&&p.ba)?"":"none";
  $("m-d").textContent=ar?p.da:p.df;
  $("m-o").textContent=t.order;
  $("m-o").href="https://wa.me/"+WHATSAPP+"?text="+encodeURIComponent(t.msg+p.fr+(p.s?" ("+p.s+")":""));
  $("ov").classList.add("on");document.body.style.overflow="hidden";$("x").focus();
}
function closeP(){$("ov").classList.remove("on");document.body.style.overflow=""}
$("grid").onclick=function(e){if(e.target.closest("a"))return;var c=e.target.closest(".card");if(c)openP(DATA[+c.getAttribute("data-i")])};
$("grid").onkeydown=function(e){if(e.key==="Enter"&&e.target.classList.contains("card"))openP(DATA[+e.target.getAttribute("data-i")])};
$("x").onclick=closeP;
$("ov").onclick=function(e){if(e.target===$("ov"))closeP()};
document.addEventListener("keydown",function(e){if(e.key==="Escape")closeP()});
render();
</script>
</body>
</html>
