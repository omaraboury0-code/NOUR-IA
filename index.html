<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Catalogue Produits</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#FAF7F5] text-stone-800 antialiased">

  <!-- =========================================================
       CATALOGUE SECTION (NOUR•IA STYLE)
  ========================================================== -->
  <section id="catalogue-section" class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-14">
    
    <!-- 1. Header + Barre de Recherche -->
    <div class="flex flex-col md:flex-row md:items-end justify-between gap-4 mb-6">
      <div>
        <p class="text-xs font-semibold uppercase tracking-widest text-rose-600 mb-1">
          Catalogue complet
        </p>
        <h2 class="text-2xl sm:text-3xl font-bold text-stone-900">
          Tous les Produits (<span id="product-count">0</span>)
        </h2>
      </div>

      <!-- Search Input -->
      <div class="relative w-full md:w-80">
        <input
          type="text"
          id="search-input"
          placeholder="Rechercher un produit..."
          class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-stone-200 bg-white text-sm shadow-sm focus:outline-none focus:ring-2 focus:ring-rose-500 focus:border-transparent transition"
        />
        <svg class="w-4 h-4 text-stone-400 absolute left-3.5 top-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-4.35-4.35M17 11A6 6 0 1 1 5 11a6 6 0 0 1 12 0z" />
        </svg>
      </div>
    </div>

    <!-- 2. Filtres par Catégorie (Pills) -->
    <div id="category-filters" class="flex items-center gap-2 overflow-x-auto pb-4 mb-6 no-scrollbar">
      <button data-cat="all" class="filter-btn active px-4 py-2 rounded-full text-xs sm:text-sm font-medium bg-rose-600 text-white shadow-sm whitespace-nowrap transition">
        Tout voir
      </button>
      <button data-cat="eau-rose" class="filter-btn px-4 py-2 rounded-full text-xs sm:text-sm font-medium bg-white text-stone-700 border border-stone-200 hover:border-rose-300 whitespace-nowrap transition">
        Eau de Rose
      </button>
      <button data-cat="huiles" class="filter-btn px-4 py-2 rounded-full text-xs sm:text-sm font-medium bg-white text-stone-700 border border-stone-200 hover:border-rose-300 whitespace-nowrap transition">
        Huiles Végétales
      </button>
      <button data-cat="soins-corps" class="filter-btn px-4 py-2 rounded-full text-xs sm:text-sm font-medium bg-white text-stone-700 border border-stone-200 hover:border-rose-300 whitespace-nowrap transition">
        Soins & Hammam
      </button>
      <button data-cat="coffrets" class="filter-btn px-4 py-2 rounded-full text-xs sm:text-sm font-medium bg-white text-stone-700 border border-stone-200 hover:border-rose-300 whitespace-nowrap transition">
        Coffrets
      </button>
    </div>

    <!-- 3. Grille des Produits -->
    <div id="products-grid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-4 sm:gap-6">
      <!-- Les cartes s'affichent automatiquement ici via JS -->
    </div>

    <!-- Message si aucun résultat -->
    <div id="empty-state" class="hidden text-center py-16">
      <p class="text-stone-500 text-sm">Aucun produit trouvé pour votre recherche.</p>
    </div>

  </section>
